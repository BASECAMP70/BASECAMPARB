<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background rounded square in accent blue -->
  <rect width="32" height="32" rx="6" fill="#f59e0b"/>
  <!-- Top cap -->
  <rect x="7" y="4" width="18" height="2.5" rx="1" fill="white"/>
  <!-- Top hourglass body (trapezoid narrowing toward centre) -->
  <polygon points="7,6.5 25,6.5 18,15.5 14,15.5" fill="white"/>
  <!-- Bottom hourglass body (trapezoid widening toward bottom) -->
  <polygon points="14,16.5 18,16.5 25,25.5 7,25.5" fill="white"/>
  <!-- Bottom cap -->
  <rect x="7" y="25.5" width="18" height="2.5" rx="1" fill="white"/>
</svg>
