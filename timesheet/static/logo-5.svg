<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36">
  <!-- Clock face -->
  <circle cx="18" cy="18" r="15" fill="#4f8ef7" opacity="0.12"/>
  <circle cx="18" cy="18" r="15" fill="none" stroke="#4f8ef7" stroke-width="2"/>
  <!-- Tick marks at 12 and 3 -->
  <line x1="18" y1="4" x2="18" y2="8" stroke="#4f8ef7" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="18" x2="28" y2="18" stroke="#4f8ef7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hour hand (~10 o'clock) -->
  <line x1="18" y1="18" x2="11" y2="11" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute hand (~2 o'clock) -->
  <line x1="18" y1="18" x2="24" y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Centre dot -->
  <circle cx="18" cy="18" r="2" fill="#4f8ef7"/>
  <!-- Wordmark -->
  <text x="40" y="23" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="white">Basecamp</text>
</svg>
